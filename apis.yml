aid: phononic
name: Phononic
description: 'Phononic is a Durham, North Carolina solid-state cooling company founded
  by CEO Tony Atti that replaces compressor-based refrigeration with semiconductor
  thermoelectric devices. Its products cool optical and fiber transceivers, co-packaged
  optics, GPU high-bandwidth memory, LiDAR sensors, medical and vaccine cold chain,
  grocery retail merchandising and HVAC. The current focus is AI data centers, where
  the Thermal Kit and Thermal Fabric combine thermoelectric cooling chips with embedded
  control firmware that the company markets as API-accessible and Redfish-compatible,
  delivering millisecond thermal response plus real-time telemetry and analytics.
  Phononic publishes no public developer portal, API reference or machine-readable
  specification; technical access runs through sales and customer support.'
